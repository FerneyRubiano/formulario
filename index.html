<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solicitud de Soporte</title>
</head>
<body>

  <h2>Solicitud de Soporte</h2>

  <form id="ticketForm">

    <label>Nombre:</label><br>
    <input type="text" name="nombre" required><br><br>

    <label>Correo:</label><br>
    <input type="email" name="correo" required><br><br>

    <label>Tipo de solicitud:</label><br>
    <input type="text" name="tipoSolicitud" required><br><br>

    <label>Prioridad:</label><br>
    <select name="prioridad" required>
      <option value="Alta">Alta</option>
      <option value="Media">Media</option>
      <option value="Baja">Baja</option>
    </select><br><br>

    <label>Descripción:</label><br>
    <textarea name="descripcion" required></textarea><br><br>

    <button type="submit">Enviar</button>

  </form>

  <script>

    const form = document.getElementById('ticketForm');

    form.addEventListener('submit', async (e) => {

      e.preventDefault();

      const formData = new FormData(form);

      const data = Object.fromEntries(formData.entries());

      const response = await fetch('https://ferneyr2.app.n8n.cloud/webhook-test/ticket-soporte', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(data)
      });

      const result = await response.json();

      alert(result.mensaje);

    });

  </script>

</body>
</html>
